<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn Japanese</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1f2937;background:#f8fafc}body{max-width:1100px;margin:auto;padding:30px 18px}h1{margin-bottom:4px}.sub,.status,.romaji{color:#64748b}.tabs{display:flex;gap:8px;margin:24px 0 14px;overflow:auto}.tab,.randomBtn{border:1px solid #cbd5e1;background:white;padding:10px 16px;border-radius:999px;font-weight:650;cursor:pointer}.tab.active{background:#111827;color:white;border-color:#111827}.controls{display:flex;gap:10px;margin-bottom:18px}input{flex:1;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:19px;margin:14px 0;box-shadow:0 1px 2px #0000000a}.jp{font-size:1.45rem;font-weight:750}.reading{font-size:1.05rem;margin-top:5px}.romaji{margin-top:4px}.en{font-weight:650;margin:12px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:750}.value{margin-top:4px;line-height:1.55}.explain{margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0}.badge{display:inline-block;font-size:.72rem;background:#f1f5f9;padding:4px 8px;border-radius:999px;margin-bottom:12px}.randomActions{margin:14px 0;display:none}@media(max-width:650px){.meta{grid-template-columns:1fr}}
</style></head><body>
<h1>日本語 Learning</h1><p class="sub">Everyday Japanese and memorable anime Japanese, with grammar breakdowns.</p>
<nav class="tabs"><button class="tab active" data-tab="random">🎲 Random</button><button class="tab" data-tab="everyday">💬 Everyday</button><button class="tab" data-tab="anime">🍥 Anime</button></nav>
<div class="controls"><input id="search" placeholder="Search Japanese, romaji, English…"></div>
<div class="randomActions" id="randomActions"><button class="randomBtn" id="newRandom">↻ New random sentence</button></div>
<div id="status" class="status">Loading…</div><main id="list"></main>
<script>
function csvParse(text){const rows=[];let row=[],field="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c=='"'&&q&&n=='"'){field+='"';i++}else if(c=='"')q=!q;else if(c==','&&!q){row.push(field);field=""}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(field);if(row.some(x=>x.length))rows.push(row);row=[];field=""}else field+=c}if(field.length||row.length){row.push(field);rows.push(row)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]||""])))}
let data=[],tab="random",randomItem=null;const $=id=>document.getElementById(id);
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(r){return `<article class="card"><span class="badge">${esc(r.Category||"Lesson")}</span><div class="jp">${esc(r.Japanese)}</div><div class="reading">${esc(r.Hiragana)}</div><div class="romaji">${esc(r.Romaji)}</div><div class="en">${esc(r.English)}</div><div class="meta"><div><div class="label">Vocabulary</div><div class="value">${esc(r.Vocabulary)}</div></div><div><div class="label">Grammar</div><div class="value">${esc(r.Grammar)}</div></div></div><div class="explain"><div class="label">Explanation</div><div class="value">${esc(r.Explanation)}</div></div></article>`}
function pickRandom(){if(!data.length)return;let next;do{next=data[Math.floor(Math.random()*data.length)]}while(data.length>1&&next===randomItem);randomItem=next;render()}
function render(){const term=$("search").value.toLowerCase();$("randomActions").style.display=tab==="random"?"block":"none";let shown;if(tab==="random"){if(!randomItem&&data.length)randomItem=data[Math.floor(Math.random()*data.length)];shown=randomItem?[randomItem]:[]}else{const cat=tab==="anime"?"Anime":"Everyday";shown=data.filter(r=>(r.Category===cat||tab==="everyday"&&r.Category==="Chat")&&Object.values(r).join(" ").toLowerCase().includes(term))}$("status").textContent=tab==="random"?"Random study — "+data.length+" total sentences":shown.length+" sentence"+(shown.length===1?"":"s");$("list").innerHTML=shown.map(card).join("")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;render()});$("newRandom").onclick=pickRandom;$("search").oninput=render;
fetch("japanese-learning.csv?"+Date.now()).then(r=>r.text()).then(t=>{data=csvParse(t);render()}).catch(()=>$("status").textContent="Could not load japanese-learning.csv");
</script></body></html>
