<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn Japanese</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1f2937;background:#f8fafc}body{max-width:1100px;margin:auto;padding:30px 18px}h1{margin-bottom:4px}.sub,.status,.romaji{color:#64748b}.tabs{display:flex;gap:8px;margin:24px 0 14px;overflow:auto}.tab,.randomBtn,.modeBtn,.navBtn{border:1px solid #cbd5e1;background:white;padding:10px 16px;border-radius:999px;font-weight:650;cursor:pointer}.tab.active,.modeBtn.active{background:#111827;color:white;border-color:#111827}.modeRow{display:flex;align-items:center;gap:8px;margin:0 0 18px}.modeLabel{font-size:.78rem;font-weight:750;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-right:3px}.cardNav{display:none;align-items:center;justify-content:center;gap:12px;margin:16px 0}.navBtn{min-width:52px;font-size:1.2rem}.counter{min-width:90px;text-align:center;color:#64748b;font-weight:650}.cardMode .card{max-width:760px;margin:18px auto;padding:26px}.cardMode .jp{font-size:1.8rem}.controls{display:flex;gap:10px;margin-bottom:18px}input{flex:1;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:19px;margin:14px 0;box-shadow:0 1px 2px #0000000a}.jp{font-size:1.45rem;font-weight:750}.reading{font-size:1.05rem;margin-top:5px}.romaji{margin-top:4px}.en{font-weight:650;margin:12px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;font-weight:750}.value{margin-top:4px;line-height:1.55}.explain{margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0}.badge{display:inline-block;font-size:.72rem;background:#f1f5f9;padding:4px 8px;border-radius:999px;margin-bottom:12px}.randomActions{margin:14px 0;display:none}@media(max-width:650px){
.meta{grid-template-columns:1fr}
body:has(#list.cardMode){padding:0;max-width:none;background:white}
body:has(#list.cardMode)>h1,body:has(#list.cardMode)>.sub,body:has(#list.cardMode)>.controls,body:has(#list.cardMode)>.status{display:none}
body:has(#list.cardMode) .tabs{margin:0;padding:10px 12px 6px;background:white}
body:has(#list.cardMode) .modeRow{margin:0;padding:4px 12px 8px;background:white}
body:has(#list.cardMode) #list.cardMode{min-height:calc(100dvh - 142px);display:flex;align-items:center;padding:0 14px 84px;box-sizing:border-box}
.cardMode .card{width:100%;max-width:none;margin:0;border:0;box-shadow:none;padding:18px 4px}
.cardMode .jp{font-size:2rem;line-height:1.4}
body:has(#list.cardMode) .cardNav{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e2e8f0;z-index:10}
body:has(#list.cardMode) .navBtn{flex:1;max-width:150px;min-height:52px;font-size:1.5rem}
body:has(#list.cardMode) .counter{min-width:76px}
}
</style></head><body>
<h1>日本語 Learning</h1><p class="sub">Everyday Japanese and memorable anime Japanese, with grammar breakdowns.</p>
<nav class="tabs"><button class="tab active" data-tab="random">🎲 Random</button><button class="tab" data-tab="everyday">💬 Everyday</button><button class="tab" data-tab="anime">🍥 Anime</button></nav>
<div class="modeRow"><span class="modeLabel">Mode</span><button class="modeBtn active" data-mode="normal">☰ Normal</button><button class="modeBtn" data-mode="card">▣ Card</button></div><div class="controls"><input id="search" placeholder="Search Japanese, romaji, English…"></div>
<div class="randomActions" id="randomActions"><button class="randomBtn" id="newRandom">↻ New random sentence</button></div>
<div id="status" class="status">Loading…</div><div class="cardNav" id="cardNav"><button class="navBtn" id="prevCard" aria-label="Previous card">←</button><span class="counter" id="counter"></span><button class="navBtn" id="nextCard" aria-label="Next card">→</button></div><main id="list"></main>
<script>
function csvParse(text){const rows=[];let row=[],field="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c=='"'&&q&&n=='"'){field+='"';i++}else if(c=='"')q=!q;else if(c==','&&!q){row.push(field);field=""}else if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(field);if(row.some(x=>x.length))rows.push(row);row=[];field=""}else field+=c}if(field.length||row.length){row.push(field);rows.push(row)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]||""])))}
let data=[],tab="random",mode="normal",randomItem=null,cardIndex=0;const $=id=>document.getElementById(id);
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(r){return `<article class="card"><span class="badge">${esc(r.Category||"Lesson")}</span><div class="jp">${esc(r.Japanese)}</div><div class="reading">${esc(r.Hiragana)}</div><div class="romaji">${esc(r.Romaji)}</div><div class="en">${esc(r.English)}</div><div class="meta"><div><div class="label">Vocabulary</div><div class="value">${esc(r.Vocabulary)}</div></div><div><div class="label">Grammar</div><div class="value">${esc(r.Grammar)}</div></div></div><div class="explain"><div class="label">Explanation</div><div class="value">${esc(r.Explanation)}</div></div></article>`}
function pickRandom(){if(!data.length)return;let next;do{next=data[Math.floor(Math.random()*data.length)]}while(data.length>1&&next===randomItem);randomItem=next;render()}
function filtered(){const term=$("search").value.toLowerCase();if(tab==="random")return data.filter(r=>Object.values(r).join(" ").toLowerCase().includes(term));const cat=tab==="anime"?"Anime":"Everyday";return data.filter(r=>r.Category===cat&&Object.values(r).join(" ").toLowerCase().includes(term))}
function moveCard(step){const items=filtered();if(!items.length)return;cardIndex=(cardIndex+step+items.length)%items.length;render()}
function render(){const term=$("search").value.toLowerCase();$("randomActions").style.display=tab==="random"?"block":"none";let pool=filtered(),shown;if(mode==="card"){if(cardIndex>=pool.length)cardIndex=0;shown=pool.length?[pool[cardIndex]]:[];$("cardNav").style.display=pool.length?"flex":"none";$("counter").textContent=pool.length?(cardIndex+1)+" / "+pool.length:"";$("list").classList.add("cardMode")}else{$("cardNav").style.display="none";$("list").classList.remove("cardMode");if(tab==="random"){if(!randomItem&&pool.length)randomItem=pool[Math.floor(Math.random()*pool.length)];shown=randomItem?[randomItem]:[]}else shown=pool}$("randomActions").style.display=tab==="random"&&mode==="normal"?"block":"none";$("status").textContent=mode==="card"?(pool.length+" cards"):(tab==="random"?"Random study — "+pool.length+" total sentences":shown.length+" sentence"+(shown.length===1?"":"s"));$("list").innerHTML=shown.map(card).join("")}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;cardIndex=0;randomItem=null;render()});
document.querySelectorAll(".modeBtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".modeBtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;cardIndex=0;render()});
$("prevCard").onclick=()=>moveCard(-1);$("nextCard").onclick=()=>moveCard(1);$("newRandom").onclick=pickRandom;$("search").oninput=()=>{cardIndex=0;randomItem=null;render()};
document.addEventListener("keydown",e=>{if(mode!=="card"||e.target.matches("input,textarea,select"))return;if(e.key==="ArrowLeft")moveCard(-1);if(e.key==="ArrowRight")moveCard(1)});
fetch("japanese-learning.csv?"+Date.now()).then(r=>r.text()).then(t=>{data=csvParse(t);render()}).catch(()=>$("status").textContent="Could not load japanese-learning.csv");
</script></body></html>
